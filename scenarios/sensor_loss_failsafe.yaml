name: sensor_loss_failsafe
description: Tomato greenhouse on a cold night, both temperature sensors lost for 2 h (power supply fault)
agronomy: >
  A tripped 24 V supply or a cut cable can take out all sensors of a zone at
  once.  Without a measurement the controller cannot close the loop.  The
  supervisor must switch to an open-loop fail-safe (heating estimated from
  the outdoor temperature), raise an alarm, and return to automatic control
  without a bump when the sensors come back.  Tomato must stay above ~10 degC.
facility: greenhouse_glass
duration_h: 36
control_dt_s: 30
initial: {t_air: 17.0, rh: 80}
weather: {type: synthetic, t_mean: 3, t_amplitude: 5, rh_mean: 80, solar_peak: 500, cloudiness: 0.3, seed: 29}
setpoint: {type: day_night, day: 21, night: 17, day_start_h: 7, day_end_h: 19, ramp_h: 1.5}
comfort_band: 1.0
crop_limits: {min: 10, max: 32}
allocator: {vent_stage: 0.6, rh_max: 88}
supervisor: {t_low_limit: 6, t_high_limit: 36, stale_timeout_s: 120, failsafe_setpoint: 17}
sensors: {count: 2, noise_std: 0.08, tau_s: 45}
faults:
  sensors:
    - {sensor: 1, kind: dropout, start_h: 26, end_h: 28}    # 02:00-04:00 on the second night
    - {sensor: 2, kind: dropout, start_h: 26, end_h: 28}
controllers: [fuzzy_pi, pid, legacy_fis]
