name: frost_protection_polytunnel
description: Strawberry polytunnel, radiative frost night (-7 degC) with an undersized heater
agronomy: >
  Strawberry flowers are killed at about -1 to -2 degC, open blossoms are the
  most sensitive stage.  Growers keep polytunnels >= 3-5 degC at night during
  flowering and 18-22 degC by day with venting.  The heater is sized for
  -4 degC, so the controller must pre-heat and never waste capacity; the
  crop-stress KPI counts hours below 1 degC.
facility: polytunnel
duration_h: 48
control_dt_s: 30
initial: {t_air: 10.0, rh: 85}
weather:
  type: synthetic
  t_mean: 4
  t_amplitude: 6
  rh_mean: 80
  solar_peak: 650
  cloudiness: 0.1
  seed: 5
  events:
    - {kind: temperature_offset, start_h: 18, end_h: 33, value: -7.0, ramp_h: 4}
    - {kind: cloud, start_h: 18, end_h: 33, value: 0.0, ramp_h: 1}
setpoint: {type: day_night, day: 18, night: 5, day_start_h: 8, day_end_h: 17, ramp_h: 2}
comfort_band: 1.5
crop_limits: {min: 1, max: 30}
allocator: {vent_stage: 0.7, min_vent: 0.0, rh_max: 92}
supervisor: {t_low_limit: 2.0, t_high_limit: 35}
sensors: {count: 2, noise_std: 0.1, tau_s: 60}
controllers: [fuzzy_pi, pid, mpc, legacy_fis]
