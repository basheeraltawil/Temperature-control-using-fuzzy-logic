name: greenhouse_sensor_actuator_faults
description: Tomato greenhouse with a drifting sensor, a frozen sensor, spikes and a failing boiler
agronomy: >
  Same crop targets as tomato_greenhouse_spring.  Field reality: aspirated
  sensor boxes drift when the fan fails or the shield gets dirty, 4-20 mA
  transmitters freeze at their last value, corroded connectors spike, boilers
  lose capacity (burner fault, fouled heat exchanger).  An undetected sensor
  error means the crop is really colder or warmer than the display says.
  A frozen sensor is the dangerous case for rule-based validation: the value
  stays in range, has no implausible rate, and looks "most continuous".
facility: greenhouse_glass
duration_h: 72
control_dt_s: 30
initial: {t_air: 16.0, rh: 80}
weather: {type: synthetic, t_mean: 8, t_amplitude: 6, rh_mean: 75, solar_peak: 650, cloudiness: 0.4, seed: 19}
setpoint: {type: day_night, day: 21, night: 17, day_start_h: 7, day_end_h: 19, ramp_h: 1.5}
comfort_band: 1.0
crop_limits: {min: 10, max: 32}
allocator: {vent_stage: 0.6, rh_max: 88}
supervisor: {t_low_limit: 6, t_high_limit: 36}
sensors: {count: 2, noise_std: 0.08, tau_s: 45}
faults:
  sensors:
    - {sensor: 1, kind: drift, start_h: 8, end_h: 30, value: 0.35}      # +0.35 K/h
    - {sensor: 2, kind: stuck, start_h: 41.5, end_h: 50}                 # frozen before the evening drop
    - {sensor: 1, kind: spike, start_h: 52, end_h: 55, value: 6.0}
  actuators:
    - {kind: heater_capacity, start_h: 62, end_h: 72, value: 0.35}      # evening + night
controllers: [fuzzy_pi, fuzzy_pi+ai, legacy_fis]
