name: heatwave_cucumber_cooling
description: Cucumber greenhouse in a dry 38 degC heat wave - vents then evaporative pad cooling
agronomy: >
  Cucumber optimum is 24-27 degC by day, 19-21 degC at night.  Above 32-35 degC
  fruit set and quality drop and the crop wilts; VPD above ~2 kPa closes
  stomata.  Evaporative pad-and-fan cooling works well in dry air (low
  outdoor RH) and also raises indoor RH.
facility: greenhouse_glass
facility_overrides: {shade: 0.3, pad_airflow_m3s: 60}
duration_h: 72
control_dt_s: 30
initial: {t_air: 24.0, rh: 55}
weather:
  type: synthetic
  t_mean: 29
  t_amplitude: 8
  rh_mean: 35
  rh_amplitude: 15
  solar_peak: 900
  cloudiness: 0.05
  seed: 7
  events:
    - {kind: temperature_offset, start_h: 30, end_h: 60, value: 4.0, ramp_h: 6}
setpoint: {type: day_night, day: 26, night: 20, day_start_h: 6, day_end_h: 20, ramp_h: 2}
comfort_band: 1.5
crop_limits: {min: 12, max: 33}
allocator: {vent_stage: 0.4, min_vent: 0.05, free_cooling_margin: 1.0}
supervisor: {t_low_limit: 8, t_high_limit: 40}
sensors: {count: 2, noise_std: 0.1, tau_s: 45}
controllers: [fuzzy_pi, pid, mpc, legacy_fis]
