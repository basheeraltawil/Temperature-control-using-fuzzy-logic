[metadata]
name = agriclimate
version = 2.0.0
description = Fuzzy-logic + AI climate control for greenhouses, growth chambers, livestock houses and cold stores, with ROS 2 / Modbus / MQTT integration
long_description = file: README.md
long_description_content_type = text/markdown
author = Basheer Al-Tawil
author_email = basheeraltaweel@gmail.com
url = https://github.com/basheeraltawil/fuzzy-greenhouse-climate-control
license = MIT

[options]
python_requires = >=3.8
packages = find:
install_requires =
    numpy>=1.21
    scipy>=1.7
    pandas>=1.3
    pyyaml>=5.4
    matplotlib>=3.5
    pydantic>=2

[options.packages.find]
include = agriclimate*

[options.extras_require]
ai = scikit-learn>=1.0
llm = anthropic>=0.70
field =
    pymodbus>=3.6,<3.10
    paho-mqtt>=2.0
dev =
    pytest>=6
    scikit-learn>=1.0
all =
    scikit-learn>=1.0
    anthropic>=0.70
    pymodbus>=3.6,<3.10
    paho-mqtt>=2.0

[options.entry_points]
console_scripts =
    agriclimate = agriclimate.cli:main

[options.data_files]
share/agriclimate/scenarios = scenarios/*.yaml
share/agriclimate/matlab = matlab/temperature_controlling1.fis
